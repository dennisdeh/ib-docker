name: Docker Image Build - ibgateway/TWS build

# Builds both images for one channel and throws them away: nothing here is
# published and no registry credentials are needed.
#
# The TWS image builds FROM the gateway image, so the gateway build is pushed to
# a throwaway registry running beside the job and the TWS build reads it back
# from there. CI therefore verifies the pair it just built rather than whatever
# ghcr.io happens to hold - which it cannot read anyway. See docs/DECISIONS.md.

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string

env:
  CHANNEL: ${{ inputs.channel }}
  # Job-local registry. Dies with the job.
  CI_GATEWAY_IMAGE: localhost:5000/ib-gateway
  CI_GATEWAY_TAG: ci
  # A channel can only build linux/arm64 for a version whose GitHub release
  # carries the arm installer. stable is pinned to a version that predates
  # those and has the x64 asset only, so building arm64 for it would fail on a
  # 404, not on anything this repository can fix. Delete the condition - both
  # here and in publish.yml - when stable is bumped. See docs/OPEN_ITEMS.md #18.
  PLATFORMS: ${{ inputs.channel == 'stable' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}

jobs:
  build:
    name: Build ibgateway & TWS

    runs-on: ubuntu-latest
    # NOTE: do not reintroduce `continue-on-error` here. It made this job report
    # success whatever the build did, so the PR check and the README badge were
    # green by construction. If one platform leg is genuinely flaky, scope the
    # tolerance to that leg - never to the whole job.
    timeout-minutes: 360
    permissions:
      contents: read

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The builder runs in its own container; host networking is what lets
          # it reach the registry service above on localhost:5000.
          driver-opts: network=host

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ env.PLATFORMS }}

      ###############################################################
      #   Build ibgateway
      ###############################################################
      - name: Build ibgateway Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: ${{ env.PLATFORMS }}
          context: ./${{ env.CHANNEL }}
          # Scope the cache per channel and per image. A shared scope means the
          # two channels overwrite each other's cache on every run.
          cache-from: type=gha,scope=${{ env.CHANNEL }}-ibgateway
          cache-to: type=gha,mode=max,scope=${{ env.CHANNEL }}-ibgateway
          tags: ${{ env.CI_GATEWAY_IMAGE }}:${{ env.CI_GATEWAY_TAG }}

      ###############################################################
      #   Build tws
      ###############################################################
      - name: Build TWS Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
          load: false
          platforms: ${{ env.PLATFORMS }}
          context: ./${{ env.CHANNEL }}
          file: ./${{ env.CHANNEL }}/Dockerfile.tws
          build-args: |
            IB_GATEWAY_BASE_IMAGE=${{ env.CI_GATEWAY_IMAGE }}
            IB_VERSION=${{ env.CI_GATEWAY_TAG }}
          cache-from: type=gha,scope=${{ env.CHANNEL }}-tws
          cache-to: type=gha,mode=max,scope=${{ env.CHANNEL }}-tws
