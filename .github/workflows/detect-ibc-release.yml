name: Detect IBC Releases

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

env:
  IBC_REPO: https://github.com/IbcAlpha/IBC.git
  BRANCH_PREFIX: IBC-update
jobs:
  detect-release:
    name: Detect Release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the bump branch
      pull-requests: write   # gh pr create
    outputs:
      update: ${{ steps.verify_latest.outputs.update }}
      branch: ${{ steps.verify_branch.outputs.BRANCH }}
      branch_exists: ${{ steps.verify_branch.outputs.BRANCH_EXISTS }}
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v6

      - name: Get Current Version
        id: version
        run: |
          CURRENT_IBC="$(grep 'ENV IBC_VERSION' Dockerfile.template|cut -d '=' -f 2)"
          echo "CURRENT_IBC=$CURRENT_IBC" >> $GITHUB_OUTPUT

      - name: Get IBC latest version
        id: ibc_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IBC_LATEST="$(gh release list -R "$IBC_REPO" --exclude-drafts --exclude-pre-releases | grep 'Latest' | cut -f1)"
          if [ -n "${IBC_LATEST}" ]
          then
            echo "IBC_LATEST=$IBC_LATEST" >> "$GITHUB_OUTPUT"
          else
            echo "IBC_LATEST=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify latest version
        id: verify_latest
        env:
          CURRENT_IBC: ${{ steps.version.outputs.CURRENT_IBC }}
          IBC_LATEST: ${{ steps.ibc_version.outputs.IBC_LATEST }}
        run: |
          current="$CURRENT_IBC"
          latest="$IBC_LATEST"

          if [[ "$current" = "$latest" ]]; then
            update="false"
          else
            update="true"
          fi

          echo "update=$update" >> $GITHUB_OUTPUT

      - name: Check if branch already exists
        id: verify_branch
        if: ${{ steps.verify_latest.outputs.update == 'true' }}
        env:
          IBC_LATEST: ${{ steps.ibc_version.outputs.IBC_LATEST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="$IBC_LATEST"
          prefix="$BRANCH_PREFIX"
          search="${prefix}-${latest}"
          echo "BRANCH=${search}" >> "$GITHUB_OUTPUT"

          # `git branch -r` was the old test and it never matched: the checkout
          # is shallow and single-branch, so no origin/* ref for the bump branch
          # exists locally however many times it has been pushed. The step then
          # reported "does not exist" every day, and `gh pr create` failed on
          # the pull request that was already open. Ask the remote instead.
          if git ls-remote --exit-code --heads origin "$search" >/dev/null; then
            echo "BRANCH_EXISTS=true" >> "$GITHUB_OUTPUT"
          # Belt and braces: the branch may have been deleted with the pull
          # request still open.
          elif [ "$(gh pr list --base master --head "$search" --state open --json number --jq 'length')" != "0" ]; then
            echo "BRANCH_EXISTS=true" >> "$GITHUB_OUTPUT"
          else
            echo "BRANCH_EXISTS=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: ${{ steps.verify_branch.outputs.BRANCH_EXISTS == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_IBC: ${{ steps.version.outputs.CURRENT_IBC }}
          IBC_LATEST: ${{ steps.ibc_version.outputs.IBC_LATEST }}
        run: |
          ver="$CURRENT_IBC"
          latest="$IBC_LATEST"
          prefix="$BRANCH_PREFIX"
          branch="${prefix}-${latest}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull
          git checkout -b "$branch"

          # update Dockerfile.template, but don't run update.sh
          # next ib gateway release will run update.sh
          echo ".> updating Dockerfile.template"
          sed -i "s/IBC_VERSION=${ver}/IBC_VERSION=${latest}/g" Dockerfile.template
          echo ".> updating Dockerfile.tws.template"
          sed -i "s/IBC_VERSION=${ver}/IBC_VERSION=${latest}/g" Dockerfile.tws.template

          # IBC ships no checksum file, so Dockerfile.template pins the digest.
          # It must move with IBC_VERSION or the next build fails verification.
          echo ".> recomputing IBC_SHA256"
          ibc_zip="IBCLinux-${latest}.zip"
          curl -sSLf -o "$ibc_zip" \
            "${IBC_REPO%.git}/releases/download/${latest}/${ibc_zip}"
          new_sha="$(sha256sum "$ibc_zip" | cut -d ' ' -f 1)"
          rm -f "$ibc_zip"
          sed -i "s/^ARG IBC_SHA256=.*/ARG IBC_SHA256=${new_sha}/" Dockerfile.template
          grep -q "^ARG IBC_SHA256=${new_sha}$" Dockerfile.template
          echo ".> IBC_SHA256 set to ${new_sha}"

          git add Dockerfile.template Dockerfile.tws.template
          git commit -m "Update IBC from ${ver} to ${latest}"
          git push --set-upstream origin "$branch"

          gh pr create --base master --fill


  build:
    name: Call build workflow
    needs: detect-release
    # Only when a bump branch was just created. Gating on `update` alone
    # rebuilt the same bump every morning for as long as its PR stayed open.
    if: >-
      needs.detect-release.outputs.update == 'true' &&
      needs.detect-release.outputs.branch_exists == 'false'
    permissions:
      contents: read
    strategy:
      matrix:
        channel: ['stable', 'latest']
    # Local ref so the caller's own build.yml is used, and `ref:` so this
    # builds the bump. Pointing at @master with no ref built master - the code
    # without the bump - which validated nothing.
    uses: ./.github/workflows/build.yml
    with:
        channel: ${{ matrix.channel }}
        ref: ${{ needs.detect-release.outputs.branch }}
