name: Detect IBC Releases

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

env:
  # OWNER/REPO: what `gh api` wants, and enough to build a download URL from.
  IBC_REPO: IbcAlpha/IBC
  BRANCH_PREFIX: IBC-update
  # Both the pinned version and the upstream tag are checked against this before
  # either is used. The tag reaches a branch name, two `sed` patterns, a
  # download URL and a `git push`, so it is third-party input in the same sense
  # as IB's buildVersion in detect-releases.yml, and gets the same treatment.
  VERSION_PATTERN: '^[0-9]+\.[0-9]+(\.[0-9]+)?$'
jobs:
  detect-release:
    name: Detect Release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the bump branch
      pull-requests: write   # gh pr create
    outputs:
      update: ${{ steps.verify_latest.outputs.update }}
      branch: ${{ steps.verify_branch.outputs.BRANCH }}
      branch_exists: ${{ steps.verify_branch.outputs.BRANCH_EXISTS }}
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v6

      - name: Get Current Version
        id: version
        run: |
          # Anchored and -m1: the old pattern was an unanchored `grep
          # 'ENV IBC_VERSION'`, which would return every matching line.
          CURRENT_IBC="$(grep -m1 '^ENV IBC_VERSION=' Dockerfile.template | cut -d '=' -f 2)"
          if ! [[ "$CURRENT_IBC" =~ $VERSION_PATTERN ]]; then
            echo "::error::Dockerfile.template pins an unreadable IBC_VERSION: '${CURRENT_IBC}'"
            exit 1
          fi

          # The Create PR step rewrites both templates with this one value, and
          # `sed` reports nothing when it matches nothing. If they disagree, the
          # bump would silently land in one file and leave the other behind.
          TWS_IBC="$(grep -m1 '^ENV IBC_VERSION=' Dockerfile.tws.template | cut -d '=' -f 2)"
          if [ "$CURRENT_IBC" != "$TWS_IBC" ]; then
            echo "::error::templates disagree: Dockerfile.template ${CURRENT_IBC}, Dockerfile.tws.template ${TWS_IBC}"
            exit 1
          fi

          echo "CURRENT_IBC=$CURRENT_IBC" >> "$GITHUB_OUTPUT"

      - name: Get IBC latest version
        id: ibc_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The old form parsed `gh release list` - a human-facing table, not a
          # stable interface - with `grep 'Latest'`, which matches the word in
          # any column including a release title, and `cut -f1`, a positional
          # field rather than a named one. Ask for the tag itself:
          # /releases/latest is defined as the latest published release,
          # excluding drafts and prereleases.
          IBC_LATEST="$(gh api "repos/${IBC_REPO}/releases/latest" --jq '.tag_name')"

          # An empty value used to be written out and compared, so a transient
          # API failure read as "there is a new version called nothing" and got
          # as far as branch IBC-update- and IBC_VERSION= in both templates.
          if ! [[ "$IBC_LATEST" =~ $VERSION_PATTERN ]]; then
            echo "::error::unexpected IBC release tag: '${IBC_LATEST}'"
            exit 1
          fi

          echo "IBC_LATEST=$IBC_LATEST" >> "$GITHUB_OUTPUT"

      - name: Verify latest version
        id: verify_latest
        env:
          CURRENT_IBC: ${{ steps.version.outputs.CURRENT_IBC }}
          IBC_LATEST: ${{ steps.ibc_version.outputs.IBC_LATEST }}
        run: |
          current="$CURRENT_IBC"
          latest="$IBC_LATEST"

          # Only ever move forward. A plain `!=` also fires when upstream's
          # latest resolves to something *older* - a re-tag, or a newer release
          # un-marked as latest - and would open a downgrade PR off the back of
          # it. `sort -V` orders 3.9 before 3.10, which a string compare does not.
          if [ "$current" = "$latest" ]; then
            update="false"
          elif [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$latest" ]; then
            update="true"
          else
            echo "::warning::IBC latest is ${latest}, behind the pinned ${current}; not downgrading"
            update="false"
          fi

          echo "update=$update" >> "$GITHUB_OUTPUT"

      - name: Check if branch already exists
        id: verify_branch
        if: ${{ steps.verify_latest.outputs.update == 'true' }}
        env:
          IBC_LATEST: ${{ steps.ibc_version.outputs.IBC_LATEST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="$IBC_LATEST"
          prefix="$BRANCH_PREFIX"
          search="${prefix}-${latest}"
          echo "BRANCH=${search}" >> "$GITHUB_OUTPUT"

          # `git branch -r` was the old test and it never matched: the checkout
          # is shallow and single-branch, so no origin/* ref for the bump branch
          # exists locally however many times it has been pushed. The step then
          # reported "does not exist" every day, and `gh pr create` failed on
          # the pull request that was already open. Ask the remote instead.
          if git ls-remote --exit-code --heads origin "$search" >/dev/null; then
            echo "BRANCH_EXISTS=true" >> "$GITHUB_OUTPUT"
          # Belt and braces: the branch may have been deleted with the pull
          # request still open.
          elif [ "$(gh pr list --base master --head "$search" --state open --json number --jq 'length')" != "0" ]; then
            echo "BRANCH_EXISTS=true" >> "$GITHUB_OUTPUT"
          else
            echo "BRANCH_EXISTS=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: ${{ steps.verify_branch.outputs.BRANCH_EXISTS == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_IBC: ${{ steps.version.outputs.CURRENT_IBC }}
          IBC_LATEST: ${{ steps.ibc_version.outputs.IBC_LATEST }}
        run: |
          ver="$CURRENT_IBC"
          latest="$IBC_LATEST"
          prefix="$BRANCH_PREFIX"
          branch="${prefix}-${latest}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull
          git checkout -b "$branch"

          # update Dockerfile.template, but don't run update.sh
          # next ib gateway release will run update.sh
          echo ".> updating Dockerfile.template"
          sed -i "s/IBC_VERSION=${ver}/IBC_VERSION=${latest}/g" Dockerfile.template
          echo ".> updating Dockerfile.tws.template"
          sed -i "s/IBC_VERSION=${ver}/IBC_VERSION=${latest}/g" Dockerfile.tws.template

          # sed exits 0 whether or not it matched.
          grep -q "^ENV IBC_VERSION=${latest}$" Dockerfile.template
          grep -q "^ENV IBC_VERSION=${latest}$" Dockerfile.tws.template

          # IBC ships no checksum file, so Dockerfile.template pins the digest.
          # It must move with IBC_VERSION or the next build fails verification.
          echo ".> recomputing IBC_SHA256"
          ibc_zip="IBCLinux-${latest}.zip"
          curl -sSLf -o "$ibc_zip" \
            "https://github.com/${IBC_REPO}/releases/download/${latest}/${ibc_zip}"
          new_sha="$(sha256sum "$ibc_zip" | cut -d ' ' -f 1)"
          rm -f "$ibc_zip"
          sed -i "s/^ARG IBC_SHA256=.*/ARG IBC_SHA256=${new_sha}/" Dockerfile.template
          grep -q "^ARG IBC_SHA256=${new_sha}$" Dockerfile.template
          echo ".> IBC_SHA256 set to ${new_sha}"

          git add Dockerfile.template Dockerfile.tws.template
          git commit -m "Update IBC from ${ver} to ${latest}"
          git push --set-upstream origin "$branch"

          gh pr create --base master --fill


  build:
    name: Call build workflow
    needs: detect-release
    # Only when a bump branch was just created. Gating on `update` alone
    # rebuilt the same bump every morning for as long as its PR stayed open.
    if: >-
      needs.detect-release.outputs.update == 'true' &&
      needs.detect-release.outputs.branch_exists == 'false'
    permissions:
      contents: read
    strategy:
      matrix:
        channel: ['stable', 'latest']
    # Local ref so the caller's own build.yml is used, and `ref:` so this
    # builds the bump. Pointing at @master with no ref built master - the code
    # without the bump - which validated nothing.
    uses: ./.github/workflows/build.yml
    with:
        channel: ${{ matrix.channel }}
        ref: ${{ needs.detect-release.outputs.branch }}
