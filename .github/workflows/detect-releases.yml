name: Detect IB Gateway Releases

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  detect-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # gh release create, push the bump branch
      pull-requests: write   # gh pr create
    # No `outputs:` here on purpose. This is a matrix job, and every leg writes
    # to the same job-output slot - last one to finish wins. `update` and
    # `channel` used to be read by the build job below, so when exactly one
    # channel had a release the build either skipped it or built the channel
    # that had not changed. The legs hand their result to the `collect` job as
    # an artifact instead, which keeps them separate.
    strategy:
      fail-fast: true
      matrix:
        channel: ["stable", "latest"]
    steps:
      - uses: actions/checkout@v6

      - name: Get Latest Version
        id: version
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          res=$(curl -s "https://download2.interactivebrokers.com/installers/tws/${CHANNEL}-standalone/version.json" | sed "s/tws${CHANNEL}_callback(//g;s/);//g")
          build_version=$(jq -r '.buildVersion' <<< "$res")
          # This value comes from a third-party server and is used below in
          # shell, in filenames and in a branch name. Refuse anything that is
          # not a plain IB version, so nothing else can ever reach those.
          if ! [[ "$build_version" =~ ^[0-9]+\.[0-9]+\.[0-9a-z]+$ ]]; then
            echo "::error::unexpected buildVersion from IB: '$build_version'"
            exit 1
          fi
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

      - name: Check if there is an update
        id: check-update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          gh release list > /tmp/ibgateway-releases
          if grep -qF "${CHANNEL}@${BUILD_VERSION}" /tmp/ibgateway-releases
          then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        env:
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          archs="x64 arm"
          for arch in $archs
          do
            download_url="https://download2.interactivebrokers.com/installers/ibgateway/${CHANNEL}-standalone/ibgateway-${CHANNEL}-standalone-linux-${arch}.sh"
            dest="ibgateway-${BUILD_VERSION}-standalone-linux-${arch}.sh"
            curl -sSL "$download_url" --output "$dest"
            sha256sum "$dest" > "${dest}.sha256"
          done

      - name: Create release
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          gh release create "ibgateway-${CHANNEL}@${BUILD_VERSION}" \
            -t "IB Gateway ${CHANNEL} ${BUILD_VERSION}" \
            -n "IB Gateway ${CHANNEL} ${BUILD_VERSION} release files" \
            ibgateway-*

      - name: Update ${{ matrix.channel }}
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        env:
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: ./update.sh "$CHANNEL" "$BUILD_VERSION"

      - name: Update README
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        env:
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          # get stable and latest versions
          export _stable_dockerfile='stable/Dockerfile'
          export _latest_dockerfile='latest/Dockerfile'
          if [ "$CHANNEL" = 'latest' ]; then
            # set latest
            export LATEST_VERSION="$BUILD_VERSION"
            export LATEST_MINOR=$(echo $LATEST_VERSION | cut -d '.' -f1,2)

            # set stable
            export STABLE_VERSION=$(grep 'ENV IB_GATEWAY_VERSION=' $_stable_dockerfile | head -1 | cut -d '=' -f2)
            export STABLE_MINOR=$(echo $STABLE_VERSION| cut -d '.' -f1,2)

          elif [ "$CHANNEL" = 'stable' ]; then
            # set STABLE
            export STABLE_VERSION="$BUILD_VERSION"
            export STABLE_MINOR=$(echo $STABLE_VERSION | cut -d '.' -f1,2)
            # set LATEST
            export LATEST_VERSION=$(grep 'ENV IB_GATEWAY_VERSION=' $_latest_dockerfile | head -1 | cut -d '=' -f2)
            export LATEST_MINOR=$(echo $LATEST_VERSION| cut -d '.' -f1,2)
          else
            echo "invalid channel: ${CHANNEL}"
            exit 1
          fi
          # IBC
          export IBC_VERSION="$(grep 'ENV IBC_VERSION' Dockerfile.template|cut -d '=' -f 2)"
          # show in log
          echo "$LATEST_VERSION,$LATEST_MINOR,$STABLE_VERSION,$STABLE_MINOR,$IBC_VERSION"
          # replace variables
          envsubst '$LATEST_VERSION,$LATEST_MINOR,$STABLE_VERSION,$STABLE_MINOR,$IBC_VERSION' < template_README.md > README.md

      - name: Create PR
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          t_branch="update-${CHANNEL}-to-${BUILD_VERSION}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull
          git checkout -b "$t_branch" origin/master
          git add "$CHANNEL" README.md
          git commit -m "Update \`${CHANNEL}\` to \`${BUILD_VERSION}\`"
          git push --set-upstream origin "$t_branch"

          gh pr create --base master --fill

      - name: Record the bump for the build job
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        env:
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          mkdir -p bumped
          echo "update-${CHANNEL}-to-${BUILD_VERSION}" > "bumped/${CHANNEL}"

      - name: Upload the bump record
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: bumped-${{ matrix.channel }}
          path: bumped/
          retention-days: 1


  collect:
    name: Collect bumped channels
    needs: detect-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any: ${{ steps.set.outputs.any }}
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Download the bump records
        uses: actions/download-artifact@v4
        continue-on-error: true   # no artifacts at all when nothing was bumped
        with:
          pattern: bumped-*
          merge-multiple: true
          path: bumped

      - name: Build the channel list
        id: set
        run: |
          include='[]'
          for f in bumped/*; do
            [ -e "$f" ] || continue
            include="$(jq -c \
              --arg c "$(basename "$f")" \
              --arg r "$(cat "$f")" \
              '. + [{channel: $c, ref: $r}]' <<< "$include")"
          done
          echo "matrix={\"include\":${include}}" >> "$GITHUB_OUTPUT"
          if [ "$include" = '[]' ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi


  build:
    name: Call build workflow
    needs: collect
    if: needs.collect.outputs.any == 'true'
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.collect.outputs.matrix) }}
    # Local ref so the caller's own build.yml is used, and `ref:` so this builds
    # the bump branch. Pointing at @master with no ref built master - the code
    # without the bump - which validated nothing.
    uses: ./.github/workflows/build.yml
    with:
        channel: ${{ matrix.channel }}
        ref: ${{ matrix.ref }}
