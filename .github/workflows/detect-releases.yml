name: Detect IB Gateway Releases

# Daily: ask Interactive Brokers what the current build is for each channel,
# and when it has moved, attach the installers to a release here, regenerate
# the channel with update.sh, open a PR - and publish to ghcr.io by calling
# publish.yml, which pushes all three images: ib-gateway and tws-rdesktop for
# that channel, plus bastion.
#
# The version this reads drives both IB images: `update.sh` renders
# `Dockerfile.tws` from the same `$VERSION`, and the TWS image copies its IB
# install out of the gateway image, so IB Gateway and TWS never carry separate
# version numbers. One detection is therefore all either image needs. The
# bastion carries no IB version at all and is tagged from its own Dockerfile.
#
# The images are published from the bot's own commit, before anyone merges the
# PR. That commit is master plus the deterministic output of `update.sh`, which
# is exactly what the merge would publish later, and waiting for a human would
# put the manual step back. See docs/DECISIONS.md.

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  detect-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # gh release create, push the bump branch
      pull-requests: write   # gh pr create
    strategy:
      fail-fast: true
      matrix:
        channel: ["stable", "latest"]
    steps:
      - uses: actions/checkout@v6

      - name: Get Latest Version
        id: version
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          res=$(curl -s "https://download2.interactivebrokers.com/installers/tws/${CHANNEL}-standalone/version.json" | sed "s/tws${CHANNEL}_callback(//g;s/);//g")
          build_version=$(jq -r '.buildVersion' <<< "$res")
          # This value comes from a third-party server and is used below in
          # shell, in filenames and in a branch name. Refuse anything that is
          # not a plain IB version, so nothing else can ever reach those.
          if ! [[ "$build_version" =~ ^[0-9]+\.[0-9]+\.[0-9a-z]+$ ]]; then
            echo "::error::unexpected buildVersion from IB: '$build_version'"
            exit 1
          fi
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

      - name: Check if there is an update
        id: check-update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          gh release list > /tmp/ibgateway-releases
          if grep -qF "${CHANNEL}@${BUILD_VERSION}" /tmp/ibgateway-releases
          then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          fi

      # Repairs a release whose asset upload only partly succeeded - the
      # `Create release` step below uploads four files and is not atomic.
      # Guarded on has_update being false, i.e. the release for the version IB
      # is serving right now already exists, because IB serves only the current
      # version per channel: for any older tag there is no source to fetch
      # from, so a gap there cannot be repaired at all. See docs/OPEN_ITEMS.md.
      - name: Backfill installers missing from the existing release
        if: ${{ steps.check-update.outputs.has_update == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          tag="ibgateway-${CHANNEL}@${BUILD_VERSION}"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for arch in x64 arm; do
            dest="ibgateway-${BUILD_VERSION}-standalone-linux-${arch}.sh"
            if grep -qxF "$dest" <<< "$assets" &&
               grep -qxF "${dest}.sha256" <<< "$assets"; then
              continue
            fi
            echo "::notice::backfilling ${arch} installer for ${tag}"
            curl -sSLf --output "$dest" \
              "https://download2.interactivebrokers.com/installers/ibgateway/${CHANNEL}-standalone/ibgateway-${CHANNEL}-standalone-linux-${arch}.sh"
            sha256sum "$dest" > "${dest}.sha256"
            gh release upload "$tag" "$dest" "${dest}.sha256" --clobber
            rm -f "$dest" "${dest}.sha256"
          done

      - name: Download
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        env:
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          archs="x64 arm"
          for arch in $archs
          do
            download_url="https://download2.interactivebrokers.com/installers/ibgateway/${CHANNEL}-standalone/ibgateway-${CHANNEL}-standalone-linux-${arch}.sh"
            dest="ibgateway-${BUILD_VERSION}-standalone-linux-${arch}.sh"
            # -f matters, and this line went without it until 2026-08-30:
            # curl exits 0 on a 404, writes the error page to the installer
            # filename, and the sha256sum below then mints a VALID digest over
            # it. The pair is uploaded to the release and the backfill step
            # above only tests that an asset is PRESENT, so nothing repairs it.
            # The build fails loudly at the checksum step rather than shipping
            # a bad image, but the release asset is permanently wrong.
            # The backfill step above already uses -sSLf; so does
            # Dockerfile.template. See docs/OPEN_ITEMS.md #35.
            curl -sSLf "$download_url" --output "$dest"
            sha256sum "$dest" > "${dest}.sha256"
          done

      - name: Create release
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          gh release create "ibgateway-${CHANNEL}@${BUILD_VERSION}" \
            -t "IB Gateway ${CHANNEL} ${BUILD_VERSION}" \
            -n "IB Gateway ${CHANNEL} ${BUILD_VERSION} release files" \
            ibgateway-*

      - name: Update ${{ matrix.channel }}
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        env:
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: ./update.sh "$CHANNEL" "$BUILD_VERSION"

      - name: Update README
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        env:
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          # get stable and latest versions
          export _stable_dockerfile='stable/Dockerfile'
          export _latest_dockerfile='latest/Dockerfile'
          if [ "$CHANNEL" = 'latest' ]; then
            # set latest
            export LATEST_VERSION="$BUILD_VERSION"
            export LATEST_MINOR=$(echo $LATEST_VERSION | cut -d '.' -f1,2)

            # set stable
            export STABLE_VERSION=$(grep 'ENV IB_GATEWAY_VERSION=' $_stable_dockerfile | head -1 | cut -d '=' -f2)
            export STABLE_MINOR=$(echo $STABLE_VERSION| cut -d '.' -f1,2)

          elif [ "$CHANNEL" = 'stable' ]; then
            # set STABLE
            export STABLE_VERSION="$BUILD_VERSION"
            export STABLE_MINOR=$(echo $STABLE_VERSION | cut -d '.' -f1,2)
            # set LATEST
            export LATEST_VERSION=$(grep 'ENV IB_GATEWAY_VERSION=' $_latest_dockerfile | head -1 | cut -d '=' -f2)
            export LATEST_MINOR=$(echo $LATEST_VERSION| cut -d '.' -f1,2)
          else
            echo "invalid channel: ${CHANNEL}"
            exit 1
          fi
          # IBC, per channel. Read from the two channel Dockerfiles rather
          # than once from Dockerfile.template: detect-ibc-release.yml bumps
          # the template alone, so the template holds what the *next* release
          # will ship rather than what either channel contains now, and the two
          # channels may legitimately differ - see docs/DECISIONS.md #2. A
          # single number in the table is therefore wrong for one of the rows.
          export LATEST_IBC=$(grep 'ENV IBC_VERSION' $_latest_dockerfile | head -1 | cut -d '=' -f2)
          export STABLE_IBC=$(grep 'ENV IBC_VERSION' $_stable_dockerfile | head -1 | cut -d '=' -f2)
          # The bastion carries no IB version; its own Dockerfile declares one.
          # Same expression publish-bastion.yml tags the published image with.
          export BASTION_VERSION=$(sed -n 's/^ARG IMAGE_VERSION=//p' bastion/Dockerfile | head -1)
          # show in log
          echo "$LATEST_VERSION,$LATEST_MINOR,$LATEST_IBC,$STABLE_VERSION,$STABLE_MINOR,$STABLE_IBC,$BASTION_VERSION"
          # replace variables
          envsubst '$LATEST_VERSION,$LATEST_MINOR,$LATEST_IBC,$STABLE_VERSION,$STABLE_MINOR,$STABLE_IBC,$BASTION_VERSION' < template_README.md > README.md

      - name: Create PR
        id: pr
        if: ${{ steps.check-update.outputs.has_update == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          t_branch="update-${CHANNEL}-to-${BUILD_VERSION}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull
          git checkout -b "$t_branch" origin/master
          git add "$CHANNEL" README.md
          git commit -m "Update \`${CHANNEL}\` to \`${BUILD_VERSION}\`"
          git push --set-upstream origin "$t_branch"

          # The publish job builds this exact commit, not the branch name: a
          # rerun, or a human pushing to the branch, must not change what was
          # published under this version.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          gh pr create --base master --fill

      - name: Record what to publish
        env:
          CHANNEL: ${{ matrix.channel }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
          HAS_UPDATE: ${{ steps.check-update.outputs.has_update }}
          COMMIT_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          # A matrix job cannot hand a value back per leg: every leg writes the
          # same `outputs:` name and the last one to finish wins, so `stable`
          # and `latest` would overwrite each other's version. The legs pass
          # files instead, and the collect job below reassembles them.
          mkdir -p pending
          jq -n \
            --argjson updated "${HAS_UPDATE:-false}" \
            --arg channel "$CHANNEL" \
            --arg version "$BUILD_VERSION" \
            --arg ref "${COMMIT_SHA:-}" \
            '{updated: $updated, channel: $channel, version: $version, ref: $ref}' \
            > "pending/${CHANNEL}.json"
          cat "pending/${CHANNEL}.json"

      - name: Upload publish plan
        uses: actions/upload-artifact@v6
        with:
          name: pending-${{ matrix.channel }}
          path: pending/${{ matrix.channel }}.json
          retention-days: 1

  collect:
    name: Collect publish plan
    needs: detect-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: Download publish plans
        uses: actions/download-artifact@v7
        with:
          pattern: pending-*
          path: pending
          merge-multiple: true

      - name: Build the publish matrix
        id: plan
        run: |
          targets="$(jq -sc '[.[] | select(.updated) | {channel, version, ref}]' pending/*.json)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$targets"

  publish:
    name: Publish ${{ matrix.target.channel }}
    needs: collect
    # `success()` is spelled out because an explicit `if:` REPLACES the implicit
    # one. Without it, a failed or skipped `collect` still reaches this job with
    # an empty `targets`, and `fromJSON('')` below is a hard error.
    if: ${{ success() && needs.collect.outputs.targets != '[]' }}
    permissions:
      contents: read
      packages: write
    strategy:
      # One channel failing to publish must not cancel the other's push.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.collect.outputs.targets) }}
    uses: ./.github/workflows/publish.yml
    with:
      channel: ${{ matrix.target.channel }}
      version: ${{ matrix.target.version }}
      ref: ${{ matrix.target.ref }}
    secrets: inherit
