name: Lint

# Runs the .pre-commit-config.yaml hook set - the same command a contributor
# runs locally. Every hook that needs a linter binary uses its *-docker variant,
# so this job needs only Python and Docker, both present on ubuntu-latest.
#
# This exists because nothing enforced the hook set before: it was configured
# but never run in CI, and two of its hooks were broken. See docs/OPEN_ITEMS.md.

on:
  workflow_dispatch:
  push:
    # '**' not '*': a single star does not match '/', so branches with a
    # slash in the name were never linted.
    branches: ['**', '!update-*-to-*', '!IBC-update*']
    tags-ignore:
      - 'v*'
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: python -m pip install --upgrade pre-commit

      - name: Run hooks
        run: pre-commit run --all-files --show-diff-on-failure --color=always
