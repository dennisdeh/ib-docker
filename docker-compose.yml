name: inv_ibkr
# One file, two IB applications. `IB_APP` in .env picks which one, by feeding
# COMPOSE_PROFILES; `bastion` carries no profile, so it always starts.
# See "Choosing the application" in README.md.
services:
  ib-gateway:
    profiles:
      - ib-gateway
    restart: always
    container_name: ${CONTAINER_NAME:-ib-gateway}
    build:
      context: ./latest
      tags:
        - "ghcr.io/dennisdeh/ib-gateway:latest"
    pull_policy: build
    image: ghcr.io/dennisdeh/ib-gateway:latest
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      TWS_USERID_PAPER: ${TWS_USERID_PAPER:-}
      TWS_PASSWORD_PAPER: ${TWS_PASSWORD_PAPER:-}
      TWS_SETTINGS_PATH: ${TWS_SETTINGS_PATH:-}
      TWS_ACCEPT_INCOMING: ${TWS_ACCEPT_INCOMING:-manual}
      TWS_MASTER_CLIENT_ID: ${TWS_MASTER_CLIENT_ID:-}
      READ_ONLY_API: ${READ_ONLY_API:-}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-exit}
      BYPASS_WARNING: ${BYPASS_WARNING:-}
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-}
      AUTO_LOGOFF_TIME: ${AUTO_LOGOFF_TIME:-}
      TWS_COLD_RESTART: ${TWS_COLD_RESTART:-}
      SAVE_TWS_SETTINGS: ${SAVE_TWS_SETTINGS:-}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-no}
      TWOFA_EXIT_INTERVAL: ${TWOFA_EXIT_INTERVAL:-60}
      TWOFA_DEVICE: ${TWOFA_DEVICE:-}
      EXISTING_SESSION_DETECTED_ACTION: ${EXISTING_SESSION_DETECTED_ACTION:-primary}
      ALLOW_BLIND_TRADING: ${ALLOW_BLIND_TRADING:-no}
      TIME_ZONE: ${TIME_ZONE:-Etc/UTC}
      TZ: ${TIME_ZONE:-Etc/UTC}
      CUSTOM_CONFIG: ${CUSTOM_CONFIG:-NO}
      JAVA_HEAP_SIZE: ${JAVA_HEAP_SIZE:-}
      SSH_TUNNEL: ${SSH_TUNNEL:-}
      SSH_OPTIONS: ${SSH_OPTIONS:-}
      SSH_ALIVE_INTERVAL: ${SSH_ALIVE_INTERVAL:-}
      SSH_ALIVE_COUNT: ${SSH_ALIVE_COUNT:-}
      SSH_PASSPHRASE: ${SSH_PASSPHRASE:-}
      SSH_REMOTE_PORT: ${SSH_REMOTE_PORT:-}
      SSH_USER_TUNNEL: ${SSH_USER_TUNNEL:-}
      SSH_RESTART: ${SSH_RESTART:-}
      SSH_VNC_PORT: ${SSH_VNC_PORT:-}
      START_SCRIPTS: ${START_SCRIPTS:-}
      X_SCRIPTS: ${X_SCRIPTS:-}
      IBC_SCRIPTS: ${IBC_SCRIPTS:-}
    volumes:
        - ${PWD}/ssh/:/home/ibgateway/.ssh
  #      - ${PWD}/jts.ini:/home/ibgateway/Jts/jts.ini
  #      - ${PWD}/config.ini:/home/ibgateway/ibc/config.ini
  #      - ${PWD}/tws_settings/:${TWS_SETTINGS_PATH:-/home/ibgateway/tws_settings}
  #      - ${PWD}/scripts:/home/ibgateway/init-scripts
    ports:
      - "127.0.0.1:${PORT_HOST_TWS_LIVE:-4001}:4003"
      - "127.0.0.1:${PORT_HOST_TWS_PAPER:-4002}:4004"
      - "127.0.0.1:${PORT_HOST_VNC_SERVER:-5900}:5900"

  tws:
    profiles:
      - tws
    restart: unless-stopped
    container_name: ${CONTAINER_NAME_TWS:-tws}
    devices:
      - /dev/dri:/dev/dri #recomended
    shm_size: "1gb" #recomended
    security_opt:
      - seccomp:unconfined #recomended
    build:
      context: ./latest
      dockerfile: Dockerfile.tws
      args:
        # tws builds FROM the gateway image, and ghcr.io/dennisdeh/ib-gateway
        # is not anonymously pullable. Defaulting to the tag the ib-gateway
        # service above produces means `docker compose build ib-gateway` then
        # `docker compose build tws` needs no registry access at all.
        IB_GATEWAY_BASE_IMAGE: ${IB_GATEWAY_BASE_IMAGE:-ghcr.io/dennisdeh/ib-gateway}
        IB_VERSION: ${IB_GATEWAY_TAG:-latest}
      tags:
        - "ghcr.io/dennisdeh/tws-rdesktop:latest"
    pull_policy: build
    image: ghcr.io/dennisdeh/tws-rdesktop:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PASSWD: ${PASSWD:-}
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      TWS_USERID_PAPER: ${TWS_USERID_PAPER:-}
      TWS_PASSWORD_PAPER: ${TWS_PASSWORD_PAPER:-}
      TWS_SETTINGS_PATH: ${TWS_SETTINGS_PATH:-}
      TWS_ACCEPT_INCOMING: ${TWS_ACCEPT_INCOMING:-manual}
      TWS_MASTER_CLIENT_ID: ${TWS_MASTER_CLIENT_ID:-}
      READ_ONLY_API: ${READ_ONLY_API:-}
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-exit}
      BYPASS_WARNING: ${BYPASS_WARNING:-}
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-}
      AUTO_LOGOFF_TIME: ${AUTO_LOGOFF_TIME:-}
      TWS_COLD_RESTART: ${TWS_COLD_RESTART:-}
      SAVE_TWS_SETTINGS: ${SAVE_TWS_SETTINGS:-}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-no}
      TWOFA_EXIT_INTERVAL: ${TWOFA_EXIT_INTERVAL:-60}
      TWOFA_DEVICE: ${TWOFA_DEVICE:-}
      EXISTING_SESSION_DETECTED_ACTION: ${EXISTING_SESSION_DETECTED_ACTION:-primary}
      ALLOW_BLIND_TRADING: ${ALLOW_BLIND_TRADING:-no}
      TIME_ZONE: ${TIME_ZONE:-Etc/UTC}
      TZ: ${TIME_ZONE:-Etc/UTC}
      CUSTOM_CONFIG: ${CUSTOM_CONFIG:-NO}
      JAVA_HEAP_SIZE: ${JAVA_HEAP_SIZE:-}
      SSH_TUNNEL: ${SSH_TUNNEL:-}
      SSH_OPTIONS: ${SSH_OPTIONS:-}
      SSH_ALIVE_INTERVAL: ${SSH_ALIVE_INTERVAL:-}
      SSH_ALIVE_COUNT: ${SSH_ALIVE_COUNT:-}
      SSH_PASSPHRASE: ${SSH_PASSPHRASE:-}
      SSH_REMOTE_PORT: ${SSH_REMOTE_PORT:-}
      SSH_USER_TUNNEL: ${SSH_USER_TUNNEL:-}
      SSH_RESTART: ${SSH_RESTART:-}
      SSH_RDP_PORT: ${SSH_RDP_PORT:-}
      START_SCRIPTS: ${START_SCRIPTS:-}
      X_SCRIPTS: ${X_SCRIPTS:-}
      IBC_SCRIPTS: ${IBC_SCRIPTS:-}
    volumes:
      - ./config:/config # optional
      - tws_tmp:/tmp # recommended for performance
    # custom certificate and key
      - ./keylock:/keylock # required to avoid key generation by container
      - ./key.pem:/etc/xrdp/key.pem # key
      - ./cert.pem:/etc/xrdp/cert.pem # cert
    ports:
      - "127.0.0.1:${PORT_HOST_RDESKTOP_LIVE:-7496}:7498"
      - "127.0.0.1:${PORT_HOST_RDESKTOP_PAPER:-7497}:7499"
      - "127.0.0.1:${PORT_HOST_RDP:-3370}:3389"

  bastion:
    build:
      context: ./bastion
      platforms:
        - "linux/amd64"
        - "linux/arm64"
      args:
        APT_PROXY: ${APT_PROXY}
        BASE_VERSION: ${BASE_VERSION}
    restart: unless-stopped
    image: dennisdeh/bastion:local-resolute
    container_name: ${CONTAINER_NAME_BASTION:-bastion}
    ports:
      - ${SSH_LISTEN_PORT}:22
    environment:
      # bastion/entrypoint.sh reads all of these at runtime. Passing only USERS
      # meant TOTP_ENABLED, CA_ENABLED and BANNER_ENABLED set in .env were
      # silently ignored when starting from the repository root.
      USERS: ${BASTION_USERS:-ibgateway}
      USER_SHELL: ${USER_SHELL:-}
      TOTP_ENABLED: ${TOTP_ENABLED:-no}
      TOTP_ISSUER: ${TOTP_ISSUER:-Bastion}
      TOTP_QR_ENCODE: ${TOTP_QR_ENCODE:-UTF8}
      CA_ENABLED: ${CA_ENABLED:-no}
      SSHD_HOST_CERT: ${SSHD_HOST_CERT:-}
      SSHD_USER_CA: ${SSHD_USER_CA:-}
      BANNER_ENABLED: ${BANNER_ENABLED:-no}
    volumes:
      - $PWD/data/etc/passwd:/etc/passwd:ro
      - $PWD/data/etc/shadow:/etc/shadow:ro
      - $PWD/data/etc/group:/etc/group:ro
      - $PWD/data/etc/ssh:/etc/ssh:ro
      - $PWD/data/home:/home:ro

volumes:
  tws_tmp:
