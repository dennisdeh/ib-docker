# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# The shell and Dockerfile linters deliberately use their *-docker variants:
# they then need only Docker, which every contributor already has to build the
# images, instead of shellcheck/shfmt/hadolint binaries installed on the host.
# The same `pre-commit run --all-files` therefore works locally and in CI
# (.github/workflows/lint.yml).
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  - id: check-shebang-scripts-are-executable
  - id: check-executables-have-shebangs
  - id: detect-private-key
- repo: https://github.com/koalaman/shellcheck-precommit
  rev: v0.11.0
  hooks:
  - id: shellcheck
- repo: https://github.com/scop/pre-commit-shfmt
  rev: v3.13.1-1
  hooks:
  - id: shfmt-docker
- repo: https://github.com/hadolint/hadolint
  rev: v2.15.1
  hooks:
  - id: hadolint-docker
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
  - id: markdownlint
- repo: https://github.com/wemake-services/dotenv-linter
  rev: 0.9.0
  hooks:
  - id: dotenv-linter
- repo: local
  hooks:
  - id: no-real-env-files
    name: refuse to commit real environment files
    language: fail
    entry: >-
      This file holds real credentials and must never be committed.
      Only .env-dist is tracked; it records the key names. See CLAUDE.md.
    files: '(^|/)\.env($|\.)|(^|/)[^/]*\.env$'
    exclude: '(^|/)[^/]*\.env-dist$'
  # config.ini and jts.ini are rendered from the templates with the IB password
  # substituted in, and both docker-compose.yml and the README suggest bind
  # mounting them from the repository root. The .env pattern above does not
  # match them and detect-private-key only looks for PEM blocks, so until
  # 2026-08-30 nothing but .gitignore stood between a documented customisation
  # and broker credentials in a public repository. The templates keep their
  # .tmpl suffix and are unaffected.
  - id: no-rendered-ibc-config
    name: refuse to commit a rendered config.ini or jts.ini
    language: fail
    entry: >-
      This file is rendered from a .tmpl with the IB password substituted in
      and must never be committed. Edit image-files/config/**/*.tmpl instead.
    files: '(^|/)(config|jts)\.ini$'
