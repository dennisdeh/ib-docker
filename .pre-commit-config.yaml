# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# The shell and Dockerfile linters deliberately use their *-docker variants:
# they then need only Docker, which every contributor already has to build the
# images, instead of shellcheck/shfmt/hadolint binaries installed on the host.
# The same `pre-commit run --all-files` therefore works locally and in CI
# (.github/workflows/lint.yml).
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  - id: check-shebang-scripts-are-executable
  - id: check-executables-have-shebangs
  - id: detect-private-key
- repo: https://github.com/koalaman/shellcheck-precommit
  rev: v0.11.0
  hooks:
  - id: shellcheck
- repo: https://github.com/scop/pre-commit-shfmt
  rev: v3.13.1-1
  hooks:
  - id: shfmt-docker
- repo: https://github.com/hadolint/hadolint
  rev: v2.15.1
  hooks:
  - id: hadolint-docker
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
  - id: markdownlint
- repo: https://github.com/wemake-services/dotenv-linter
  rev: 0.9.0
  hooks:
  - id: dotenv-linter
- repo: local
  hooks:
  - id: no-real-env-files
    name: refuse to commit real environment files
    language: fail
    entry: >-
      This file holds real credentials and must never be committed.
      Only .env-dist is tracked; it records the key names. See CLAUDE.md.
    files: '(^|/)\.env($|\.)|(^|/)[^/]*\.env$'
    exclude: '(^|/)[^/]*\.env-dist$'
