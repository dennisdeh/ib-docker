# markdownlint configuration
#
# MD013 (line-length) is disabled deliberately: README.md is generated from
# template_README.md by envsubst in .github/workflows/detect-releases.yml, and
# most long lines are option tables whose width is set by their content. Wrapping
# them is not possible without breaking the tables, and the generator would undo
# any manual reflow at the next release. See docs/DECISIONS.md.
MD013: false

# The logo in template_README.md is an <img> tag because it needs an explicit
# height; CommonMark image syntax cannot express that.
MD033: false

# MD036 (emphasis-as-heading) is disabled because CLAUDE.md prescribes a
# vintage line - *Last updated: YYYY-MM-DD* - under headings throughout docs/.
# That is metadata, not a heading, and the rule cannot tell the difference.
MD036: false

# MD060 (table-column-style) arrived with markdownlint-cli 0.49 and fires 228
# times, all of it padding inside table pipes. It is the same case as MD013
# above: the tables it objects to are in README.md, which is generated, so a
# hand-reflow is undone at the next IB Gateway release - and the rule is about
# how a table is spelled, not whether it renders. See docs/DECISIONS.md #28.
MD060: false
